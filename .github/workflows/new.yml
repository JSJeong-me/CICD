# 워크플로우의 이름을 지정합니다. GitHub Actions 탭에 이 이름이 표시됩니다.
name: CI

# 워크플로우를 트리거할 이벤트를 지정합니다.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 워크플로우에서 실행될 하나 이상의 작업을 정의합니다.
jobs:
  # 'build'라는 이름의 작업을 정의합니다.
  build:
    # 작업이 실행될 환경을 지정합니다. (예: 최신 버전의 Ubuntu)
    runs-on: ubuntu-latest

    # 작업 내에서 실행될 단계들을 순서대로 정의합니다.
    steps:
      # 코드를 체크아웃하는 액션을 사용합니다.
      - uses: actions/checkout@v4

      # 여기에 빌드, 테스트, 린트 등의 단계를 추가합니다.

