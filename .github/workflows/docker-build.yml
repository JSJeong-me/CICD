# 워크플로우의 이름을 지정합니다. GitHub Actions 탭에 표시됩니다.
name: Docker Image CI to GHCR

# 이 워크플로우가 언제 실행될지를 정의합니다.
# 'main' 브랜치에 코드가 push될 때마다 실행됩니다.
on:
  push:
    branches: [ "main" ]

# 실행될 작업을 정의합니다.
jobs:
  build-and-push:
    # 작업이 실행될 가상 환경을 지정합니다. (최신 Ubuntu)
    runs-on: ubuntu-latest

    # 이 작업에 필요한 권한을 부여합니다.
    # packages: write는 ghcr.io에 이미지를 푸시하기 위해 필수입니다.
    permissions:
      contents: read
      packages: write

    # 실제 작업 단계를 순서대로 정의합니다.
    steps:
      # 1. 저장소의 코드를 가상 환경으로 내려받습니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ghcr.io에 로그인합니다.
      # GITHUB_TOKEN은 Actions에서 자동으로 생성되는 비밀 토큰으로, 별도 설정이 필요 없습니다.
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # 현재 작업을 실행한 사용자 아이디
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Docker 이미지에 대한 메타데이터(태그, 레이블)를 추출합니다.
      # 이렇게 하면 이미지 이름을 하드코딩하지 않아도 됩니다.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }} # 이미지 이름: ghcr.io/소유자/저장소이름

      # 4. Docker 이미지를 빌드하고 ghcr.io에 푸시합니다.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Dockerfile이 있는 위치 (저장소 루트)
          push: true # 빌드 후 푸시 실행
          tags: ${{ steps.meta.outputs.tags }} # 3단계에서 생성된 태그 사용
          labels: ${{ steps.meta.outputs.labels }} # 3단계에서 생성된 레이블 사용
